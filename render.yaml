# Blueprint do Render: cria o banco Postgres e o web service já conectados.
# No Render: New > Blueprint > aponte para este repositório.
databases:
  - name: construir-reformar-db
    plan: free
    databaseName: construir_reformar
    user: construir_reformar

services:
  - type: web
    name: construir-reformar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --preload app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SECRET_KEY
        generateValue: true          # o Render gera um segredo forte
      - key: DATABASE_URL
        fromDatabase:
          name: construir-reformar-db
          property: connectionString
      - key: ADMIN_EMAIL             # você preenche no painel do Render
        sync: false
      - key: ADMIN_SENHA             # você preenche no painel do Render (senha forte!)
        sync: false
      - key: SEED_DEMO
        value: "1"                   # "1" popula dados de exemplo; troque para "0" antes do lançamento real
